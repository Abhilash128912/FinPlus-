name: Daily Stock Screener Scan

on:
  schedule:
    # 1) Pre-market scan at 09:15 AM IST (03:45 UTC)
    - cron: '45 3 * * 1-5'
    # 2) Hourly scans 5 mins after each 1H candle close (10:20, 11:20, 12:20, 13:20, 14:20, 15:20 IST = 04:50, 05:50, 06:50, 07:50, 08:50, 09:50 UTC)
    - cron: '50 4-9 * * 1-5'
    # 3) Market close final scan at 03:35 PM IST (10:05 UTC)
    - cron: '5 10 * * 1-5'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI anytime

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write   # needed to commit index.html back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # GitHub only fires `schedule` from the default branch (main), but Render
          # deploys from `screener`. Without this the scan ran against main and
          # committed there, so refreshed data never reached the deployment or the
          # phone. Check out and commit to the branch that is actually served.
          ref: screener

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Nifty 500 stock screener scan
        env:
          # Yahoo throttles bursts from cloud IP ranges, and CI starts cold every
          # run because cache/ is gitignored, so the whole universe is fetched
          # fresh. Fewer parallel requests survive that; the laptop keeps 16.
          SCREENER_SCAN_WORKERS: '6'
        run: |
          echo "Starting full Nifty 500 scan at $(date '+%Y-%m-%d %H:%M:%S UTC')"
          # Retried rather than failed outright: ten of the first twenty-four
          # scheduled runs succeeded, and the failures are throttling rather than
          # anything wrong with the data, so a second attempt minutes later
          # usually lands. ci_scan.py aborts without writing when it is blocked,
          # so a failed attempt leaves the committed report untouched.
          for attempt in 1 2 3; do
            echo "--- scan attempt $attempt of 3 ---"
            if python ci_scan.py; then
              echo "Scan succeeded on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed"
            if [ "$attempt" -lt 3 ]; then
              echo "Waiting 120s before retrying..."
              sleep 120
            fi
          done
          echo "All 3 attempts failed — leaving the previous report in place"
          exit 1

      - name: Commit and push updated report
        run: |
          git config --global user.name  "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          # lt_watchlist_enriched.json carries the computed LT buy/wait signals the
          # mobile API serves. Without it the phone falls back to the static config,
          # which has no status/badge/ltp at all, so an automated scan would refresh
          # the desktop page while leaving the app's signals frozen.
          # mobile.html is the phone app's page and scan_meta.json carries the scan
          # time both pages display; omitting either leaves the app frozen or the
          # timestamp claiming a freshness the data does not have.
          git add screener.html mobile.html scan_meta.json \
                  screener_data.json static/app.css static/app.js \
                  daily_picks_history.json watchlist_data.json \
                  lt_watchlist_enriched.json lt_discovery_pipeline.json \
                  penny_monthly_picks.json || true

          if git diff --cached --quiet; then
            echo "No changes to commit (data unchanged since last scan)"
          else
            IST=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M IST')
            git commit -m "auto: daily scan $IST [skip ci]"
            git push origin HEAD:screener
            echo "Successfully pushed updated scan report to screener"
          fi

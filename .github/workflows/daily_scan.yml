name: Daily Stock Screener Scan

on:
  schedule:
    # 1) Pre-market scan at 09:15 AM IST (03:45 UTC)
    - cron: '45 3 * * 1-5'
    # 2) Hourly scans 5 mins after each 1H candle close (10:20, 11:20, 12:20, 13:20, 14:20, 15:20 IST = 04:50, 05:50, 06:50, 07:50, 08:50, 09:50 UTC)
    - cron: '50 4-9 * * 1-5'
    # 3) Market close final scan at 03:35 PM IST (10:05 UTC)
    - cron: '5 10 * * 1-5'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI anytime

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write   # needed to commit index.html back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # GitHub only fires `schedule` from the default branch (main), but Render
          # deploys from `screener`. Without this the scan ran against main and
          # committed there, so refreshed data never reached the deployment or the
          # phone. Check out and commit to the branch that is actually served.
          ref: screener

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Nifty 500 stock screener scan
        run: |
          echo "Starting full Nifty 500 scan at $(date '+%Y-%m-%d %H:%M:%S IST')"
          # Run in scan-only mode (no web server, no blocking join)
          python -c "
          import json, os, sys
          sys.path.insert(0, '.')
          import fetch_and_build as fb
          import download_nse_indices

          print('Updating Nifty stock list from NSE...')
          try:
              download_nse_indices.main()
          except Exception as e:
              print(f'  Stock list update skipped: {e}')

          print('Reading stock list...')
          tickers = fb.read_stock_list()
          print(f'  Loaded {len(tickers)} tickers')

          print('Fetching NIFTY 50 benchmark & analyzing Market Regime...')
          nifty_df, nifty_regime = fb.fetch_nifty_history()

          print('Running scan (this takes 10-12 minutes)...')
          results = fb.run_scan(tickers)
          if not results or len(results) < 10:
              print('❌ Error: Scan yielded less than 10 results. It is likely that the request was rate-limited or blocked. Aborting to prevent overwriting the report with empty data.')
              sys.exit(1)

          print('Computing Mansfield Relative Strength (RS Rating 1-99) vs Nifty...')
          results = fb.compute_relative_strength_ratings(
              results, nifty_df,
              nifty_regime_status=nifty_regime.get('status', 'NEUTRAL')
          )

          print('Processing watchlist...')
          wl_data = fb.process_watchlist(results)

          print('Processing LT watchlist...')
          lt_wl_data = fb.process_lt_watchlist(results)

          print('Fetching commodity signals...')
          commodity_signals = fb.fetch_commodity_signals()

          print('Processing F&O signals...')
          fno_data = fb.process_fno_stocks(results)

          mkt_info = fb.get_market_status()
          mkt_info['nifty'] = nifty_regime

          print('Building HTML report (also writes static/app.css, static/app.js)...')
          html = fb.build_html(results, wl_data, lt_wl_data, commodity_signals, mkt_info, fno_data)

          with open(fb.OUT_HTML, 'w', encoding='utf-8') as f:
              f.write(html)
          os.makedirs(os.path.dirname(fb.OUT_WWW_HTML), exist_ok=True)
          with open(fb.OUT_WWW_HTML, 'w', encoding='utf-8') as f:
              f.write(html)

          # screener.html now fetches its data from screener_data.json instead of
          # inlining it, so this file must be committed alongside screener.html for
          # the same reason index.html always was: it's what a freshly-restarted
          # Heroku dyno serves instantly while its own background rescan is still
          # running (see fetch_and_build.py's startup_bg_tasks / background_initial_scan).
          clean_results = fb.sanitize_for_strict_json(results)
          with open(fb.OUT_JSON_FILE, 'w', encoding='utf-8') as f:
              json.dump(clean_results, f, default=fb.json_serializer)

          print(f'Scan complete! screener.html ({len(html):,} bytes), screener_data.json, static/app.css & static/app.js updated')
          "

      - name: Commit and push updated report
        run: |
          git config --global user.name  "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          # lt_watchlist_enriched.json carries the computed LT buy/wait signals the
          # mobile API serves. Without it the phone falls back to the static config,
          # which has no status/badge/ltp at all, so an automated scan would refresh
          # the desktop page while leaving the app's signals frozen.
          git add screener.html screener_data.json static/app.css static/app.js \
                  daily_picks_history.json watchlist_data.json \
                  lt_watchlist_enriched.json lt_discovery_pipeline.json \
                  penny_monthly_picks.json || true

          if git diff --cached --quiet; then
            echo "No changes to commit (data unchanged since last scan)"
          else
            IST=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M IST')
            git commit -m "auto: daily scan $IST [skip ci]"
            git push origin HEAD:screener
            echo "Successfully pushed updated scan report to screener"
          fi

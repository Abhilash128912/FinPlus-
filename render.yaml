services:
  - type: web
    name: stock-screener-api
    runtime: python311
    plan: standard
    buildCommand: |
      pip install -r requirements.txt
    startCommand: python fetch_and_build.py
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.0
      # The full 2,568-stock scan never completed on this instance and, while it
      # ran, suppressed live price refresh -- the one job this deployment has.
      # Scanning happens on the laptop; screener_data.json and
      # lt_watchlist_enriched.json are committed, so each deploy ships fresh output.
      - key: SCREENER_ENABLE_SCAN
        value: "0"
      # Secret: set the value in the Render dashboard, never in this file.
      # This repo is public, and this token guards /api/sync/scan-data, which
      # overwrites the scan data the app serves.
      - key: SCREENER_SYNC_TOKEN
        sync: false
    routes:
      - path: /
        destination: http://localhost:10000
      - path: /api/mobile/*
        destination: http://localhost:10000
      - path: /api/ltp
        destination: http://localhost:10000
    autoDeploy: true
    buildFilter:
      ignoredPaths:
        - ./**/*.json
        - ./**/*.html
    headers:
      - path: /api/mobile/*
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /api/mobile/*
        name: Content-Type
        value: "application/json"
